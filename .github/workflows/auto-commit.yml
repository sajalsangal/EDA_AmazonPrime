name: Three Daily Auto-Commits

on:
  workflow_dispatch:
  schedule:
    - cron:  '0 0 * * *'     # 00:00 UTC
    - cron:  '0 8 * * *'     # 08:00 UTC
    - cron:  '0 16 * * *'    # 16:00 UTC

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update README with timestamp
        run: |
          # If "Last auto-commit:" exists, replace it. Else, add at the end.
          if grep -q "Last auto-commit:" README.md; then
            sed -i "s/^Last auto-commit:.*/Last auto-commit: $(date -u)/" README.md
          else
            echo -e "\nLast auto-commit: $(date -u)" >> README.md
          fi

      - name: Commit and push changes
        run: |
          git add README.md
          git commit -m "Automated commit: $(date -u)" || echo "No changes to commit"
          git push origin main